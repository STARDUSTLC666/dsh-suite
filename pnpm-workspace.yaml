verifyDepsBeforeRun: false
# These first-party packages are exact version pins, with registry integrity checked
# by the manifest test. Name exclusions also work in pnpm 11.7 frozen installs.
minimumReleaseAgeExclude:
  - '@stardustlc/dsh-docker'
  - '@stardustlc/dsh-dream'
  - dsh-calendar
  - dsh-cite
  - dsh-code-security
  - dsh-codex-port
  - dsh-dingtalk
  - dsh-email
  - dsh-ffmpeg
  - dsh-flakefinder
  - dsh-hyperframes
  - dsh-minimal-ptc
  - dsh-ppt
  - dsh-remotion
  - dsh-rss
  - dsh-slack
  - dsh-sql
  - dsh-voice
  # Reviewed Socket Mode 3.1 SDK release and its new transitive packages.
  - '@slack/socket-mode@3.1.0'
  - '@slack/types@3.2.0'
  - '@slack/web-api@8.2.0'
  # Reviewed Email dependency updates; keep release-age exceptions version-specific.
  - 'imapflow@2.2.1'
  - 'mailparser@3.9.33'
  - 'nodemailer@10.0.13'
  - 'ip-address@10.7.3'
