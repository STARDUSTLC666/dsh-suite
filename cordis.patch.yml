# dsh-suite 组合包补丁：一次装入 STARDUSTLC 全部 18 个 DSH 插件。
# 每行默认配置与组件自带 cordis.patch.yml 完全一致；
# 用户可在自己 profile 的 cordis.patch.yml 里按 id 覆盖任意组件的 config。
- insert:
    - id: calendar
      name: 'dsh-calendar'
      config:
        provider: custom
    - id: cite
      name: 'dsh-cite'
      config:
        timeoutMs: 15000
    - id: code-security
      name: 'dsh-code-security'
      config:
        maxFiles: 5000
        failOn: medium
    - id: codex-port
      name: 'dsh-codex-port'
      config: {}
    - id: tool-dingtalk
      name: dsh-dingtalk
      config: {}
    - id: docker
      name: '@stardustlc/dsh-docker'
      config:
        timeoutMs: 60000
    - id: dream
      name: '@stardustlc/dsh-dream'
      config:
        maxSessions: 10
        maxCharsPerSession: 6000
    - id: tool-email
      name: dsh-email
      config: {}
    - id: ffmpeg
      name: 'dsh-ffmpeg'
      config:
        timeoutMs: 300000
    - id: flakefinder
      name: 'dsh-flakefinder'
      config:
        defaultRuns: 5
        writeApproval: true
    - id: hyperframes-skills
      name: 'dsh-hyperframes'
      config: {}
    - id: ptc-minimal-preset
      name: 'dsh-minimal-ptc'
    - id: dsh-ppt
      name: dsh-ppt
      config: {}
    - id: remotion-skills
      name: 'dsh-remotion'
      config: {}
    - id: rss
      name: 'dsh-rss'
      config:
        timeoutMs: 15000
    - id: slack
      name: dsh-slack
      config:
        # Slack 令牌：机器人令牌（xoxb-）或用户令牌（xoxp-）。
        # 留空时回退到环境变量 DSH_SLACK_TOKEN。
        token: ''
        # 默认频道（可选）：模型未特别指定频道时的默认目标（如 #general）。
        defaultChannel: ''
        # App-Level Token（xapp- 开头）：开启 Socket Mode 后用于接收消息。
        # 留空时回退到环境变量 DSH_SLACK_APP_TOKEN；两者都为空则仅单向（不收消息）。
        appToken: ''
    - id: sql
      name: 'dsh-sql'
      config:
        maxRows: 1000
    - id: voice
      name: 'dsh-voice'
      config:
        asrEngine: groq
        asrModel: whisper-large-v3-turbo
